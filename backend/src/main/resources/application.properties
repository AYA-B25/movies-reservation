spring.application.name=movies_backend
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_HOST_PORT:3306}/${MYSQL_DATABASE:DB_name}
spring.datasource.username=${MYSQL_USER:app_user}
spring.datasource.password=${MYSQL_PASSWORD:user_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

spring.jpa.open-in-view=false

admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.firstName = ${ADMIN_FIRST_NAME}
admin.lastName = ${ADMIN_LAST_NAME}

app.cors.allowed-origin=${FRONTEND_URL}